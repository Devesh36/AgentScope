name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 09:00 India time. Monday includes the heavier installation checks.
    - cron: '30 3 * * 0,2-6'
    - cron: '30 3 * * 1'
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv venv && uv pip sync --require-hashes apps/api/requirements.txt && uv pip install --no-deps -e packages/python-sdk
      - run: .venv/bin/ruff check apps/api packages/python-sdk packages/cli examples
      - run: uv pip install --no-deps -e . && npm run test:cli
      - run: .venv/bin/mypy apps/api/app --ignore-missing-imports --follow-untyped-imports
      - run: cd apps/api && ../../.venv/bin/pytest -q
      - name: Record reproducible performance measurements
        run: npm run accept:performance -- --report .local/performance-report.json
      - name: Save performance measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-measurements
          path: .local/performance-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  landing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/landing
      - run: npm run build && npm run typecheck && npm run verify
        working-directory: apps/landing
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  local-stack-acceptance:
    if: github.event_name != 'schedule' || github.event.schedule == '30 3 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked native dependencies
        run: |
          uv venv
          uv pip sync --require-hashes apps/api/requirements.txt
          uv pip install --no-deps -e packages/python-sdk -e .
          npm --prefix apps/web ci --no-audit --no-fund
      - name: Container, SDK, browser and persistence acceptance
        run: npm run accept:containers
      - name: Save sanitized measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-stack-measurements
          path: |
            .local/container-acceptance/*/report.json
            .local/container-acceptance/*/restart.json
            .local/container-acceptance/*/browser-reconnection.json
            .local/container-acceptance/*/cli.json
          include-hidden-files: true
          if-no-files-found: ignore
  cli-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the user-facing tool
        run: |
          uv tool install .
          agentscope --version
          printf 'help\nexit\n' | Agenscope Repl
  local-watch-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and build the local runtime
        run: |
          uv venv
          uv pip sync --require-hashes apps/api/requirements.txt
          uv pip install --no-deps -e packages/python-sdk -e .
          npm --prefix apps/web ci --no-audit --no-fund
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Provider SDK, watch lifecycle, and browser acceptance
        run: npm run accept:watch -- --browser
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Save sanitized watch measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-watch-measurements
          path: .local/watch-acceptance/*/report.json
          include-hidden-files: true
          if-no-files-found: ignore
  homebrew-install:
    if: github.event_name != 'schedule' || github.event.schedule == '30 3 * * 1'
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install and test the custom formula
        run: |
          brew tap-new Devesh36/agentscope
          cp Formula/agentscope.rb "$(brew --repository Devesh36/agentscope)/Formula/agentscope.rb"
          # Test the checked-out candidate, including PRs whose release tag does not exist yet.
          export AGENTSCOPE_CI_ARCHIVE="$RUNNER_TEMP/agentscope-ci.tar.gz"
          git archive --format=tar.gz --output="$AGENTSCOPE_CI_ARCHIVE" HEAD
          python3 - "$(brew --repository Devesh36/agentscope)/Formula/agentscope.rb" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          archive = Path(os.environ["AGENTSCOPE_CI_ARCHIVE"])
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          source = r'  url "https://github\.com/Devesh36/AgentScope\.git",\n      using: :git,\n      tag: "v[0-9.]+"\n'
          replacement = f'  url {json.dumps(archive.as_uri())}\n  sha256 "{checksum}"\n'
          formula, count = re.subn(source, lambda _: replacement, path.read_text())
          if count != 1:
              raise SystemExit("Expected release source not found in formula")
          path.write_text(formula)
          PY
          brew install --build-from-source Devesh36/agentscope/agentscope
          brew test Devesh36/agentscope/agentscope
          printf 'help\nexit\n' | Agenscope Repl
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit locked dashboard dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web
      - name: Audit locked public-site dependencies
        if: always()
        run: npm audit --omit=dev --audit-level=high
        working-directory: apps/landing
      - name: Audit locked Python dependencies
        if: always()
        run: uvx --from pip-audit==2.9.0 pip-audit --requirement apps/api/requirements.txt --require-hashes --disable-pip
