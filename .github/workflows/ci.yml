name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv venv && uv pip sync apps/api/requirements.txt && uv pip install --no-deps -e packages/python-sdk
      - run: .venv/bin/ruff check apps/api packages/python-sdk examples
      - run: .venv/bin/mypy apps/api/app --ignore-missing-imports --follow-untyped-imports
      - run: cd apps/api && ../../.venv/bin/pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  local-stack-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked native dependencies
        run: |
          uv venv
          uv pip sync --require-hashes apps/api/requirements.txt
          uv pip install --no-deps -e packages/python-sdk
          npm --prefix apps/web ci --no-audit --no-fund
      - name: Container, SDK, browser and persistence acceptance
        run: npm run accept:containers
      - name: Save sanitized measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-stack-measurements
          path: |
            .local/container-acceptance/*/report.json
            .local/container-acceptance/*/restart.json
            .local/container-acceptance/*/browser-reconnection.json
          include-hidden-files: true
          if-no-files-found: ignore
