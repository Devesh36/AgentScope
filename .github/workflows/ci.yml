name: Validate
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv venv && uv pip sync apps/api/requirements.txt && uv pip install --no-deps -e packages/python-sdk
      - run: .venv/bin/ruff check apps/api packages/python-sdk examples
      - run: .venv/bin/mypy apps/api/app --ignore-missing-imports --follow-untyped-imports
      - run: cd apps/api && ../../.venv/bin/pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
